<!doctype html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Sayfa bulunamadı · TypeShield</title>
  <meta name="robots" content="noindex" />
  <link rel="stylesheet" href="/fonts.css" />
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <style>
    :root { --paper: #f4f7f6; --ink: #14211c; --muted: #56645d; --accent: #00806b; --ink-on: #fff; color-scheme: light dark; }
    @media (prefers-color-scheme: dark) { :root { --paper: #0f1714; --ink: #e7efeb; --muted: #9fb0a8; --accent: #12a58b; --ink-on: #04120e; } }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--paper); color: var(--ink); font: 16px/1.6 'Public Sans', system-ui, sans-serif; text-align: center; padding: 24px; box-sizing: border-box; }
    svg { width: 72px; height: 72px; }
    .shield { fill: var(--accent); } .bar { fill: var(--paper); }
    h1 { font: 700 40px/1.1 'Bricolage Grotesque', system-ui, sans-serif; margin: 24px 0 8px; }
    p { color: var(--muted); margin: 0 0 28px; }
    a { display: inline-block; padding: 12px 22px; border-radius: 10px; background: var(--accent); color: var(--ink-on); font-weight: 600; text-decoration: none; }
  </style>
</head>
<body>
  <main>
    <svg viewBox="0 0 32 32" aria-hidden="true"><path class="shield" d="M16 2.5 4.5 7v8.4c0 7.2 4.8 12.4 11.5 14.6 6.7-2.2 11.5-7.4 11.5-14.6V7z"/><rect class="bar" x="9.5" y="14" width="13" height="4.2" rx="1.2"/></svg>
    <h1>Bu sayfa bulunamadı</h1>
    <p>Aradığın sayfa taşınmış ya da hiç var olmamış olabilir.</p>
    <a href="/">Ana sayfaya dön</a>
  </main>
</body>
</html>
